<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单文件网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #121212;
            color: #ffffff;
            min-height: 100vh;
        }
        header {
            background: #1f1f1f;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: #cccccc;
            text-decoration: none;
            margin-left: 16px;
        }
        nav a:hover {
            color: #60a5fa;
        }
        main {
            max-width: 920px;
            margin: 80px auto;
            padding: 0 20px;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .center-box {
            text-align: center;
            margin-top: 120px;
        }
        .center-box a {
            color:#60a5fa;
            text-decoration: none;
        }
        footer {
            text-align: center;
            padding:30px;
            color:#888888;
            font-size:14px;
        }
    </style>
</head>
<body>
    <header>
        <h2>单文件站点</h2>
        <nav>
            <a href="#home">首页</a>
            <a href="#404">404页面演示</a>
        </nav>
    </header>

    <!-- 首页 -->
    <div id="home" class="page active">
        <main>
            <h1>欢迎访问本站</h1>
            <p style="margin-top:16px;color:#aaa;">全部内容都在这一个HTML文件内，无需外部文件。</p>
        </main>
    </div>

    <!-- 404页面 -->
    <div id="404" class="page">
        <main class="center-box">
            <h1>404</h1>
            <p style="margin:12px 0 24px;">该页面没有找到</p>
            <a href="#home">返回首页</a>
        </main>
    </div>

    <footer>© 2026 单文件网站</footer>

    <script>
        // 路由切换逻辑
        function renderPage(){
            const hash = window.location.hash || "#home";
            document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
            const target = document.querySelector(hash);
            if(target){
                target.classList.add("active");
            }else{
                // 哈希不存在自动切404
                document.querySelector("#404").classList.add("active");
            }
        }
        window.addEventListener("hashchange", renderPage);
        window.addEventListener("load", renderPage);
        console.log("单文件网页加载完毕");
    </script>
</body>
</html>
